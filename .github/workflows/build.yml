name: Build Dwarkesh Enterprise APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Dwarkesh_Enterprise_V8_GitHub_APK_Source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s Dwarkesh_Enterprise_V8_GitHub_APK_Source.zip || {
            echo '::error::Dwarkesh Android source ZIP is missing or empty'; exit 1;
          }
          mkdir -p extracted_files
          unzip -oq Dwarkesh_Enterprise_V8_GitHub_APK_Source.zip -d extracted_files
          test -f extracted_files/settings.gradle
          test -f extracted_files/build.gradle
          test -f extracted_files/app/build.gradle
          test -f extracted_files/app/src/main/AndroidManifest.xml
          test -f extracted_files/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners have Android SDK installed already.
      # Do NOT run android-actions/setup-android@v3: its attempt to install
      # the retired 'tools' package fails on recent Android SDK repositories.
      - name: Install Android platform 35 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDK_MANAGER" ]]; then
            for p in "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$p" ]]; then SDK_MANAGER="$p"; break; fi
            done
          fi
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "::error::sdkmanager not available in runner Android SDK: $SDK_ROOT"
            exit 1
          fi
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted_files
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK=extracted_files/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo '::error::Debug APK was not created'; exit 1; }
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dwarkesh-Enterprise-V8-APK
          path: extracted_files/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
