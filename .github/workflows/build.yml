name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP and Build APK
        run: |
          unzip -o "*.zip" -d extracted_files
          PROJECT_DIR=$(find extracted_files -name "settings.gradle" -printf "%h\n" | head -n 1)
          cd "$PROJECT_DIR"
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dwarkesh-PriceList-APK
          path: "*/build/outputs/apk/debug/.apk"
