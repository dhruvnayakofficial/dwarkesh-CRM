name: Build Dwarkesh Business OS V10 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Dwarkesh_Business_OS_V10_Source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          test -s Dwarkesh_Business_OS_V10_Source.zip
          mkdir -p extracted_files
          unzip -oq Dwarkesh_Business_OS_V10_Source.zip -d extracted_files
          for file in settings.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            test -s "extracted_files/$file" || { echo "::error::Missing $file"; exit 1; }
          done
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDK_MANAGER" ]]; then
            for p in "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$p" ]]; then SDK_MANAGER="$p"; break; fi
            done
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (test only)
        working-directory: extracted_files
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify debug APK
        run: test -s extracted_files/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Dwarkesh-OS-V10-TEST-APK
          path: extracted_files/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Restore permanent signing key when configured
        id: signing
        env:
          B64: ${{ secrets.DWARKESH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DWARKESH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DWARKESH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DWARKESH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$B64" | base64 --decode > "$RUNNER_TEMP/dwarkesh-release.jks"
            chmod 600 "$RUNNER_TEMP/dwarkesh-release.jks"
            echo "DW_KEYSTORE_FILE=$RUNNER_TEMP/dwarkesh-release.jks" >> "$GITHUB_ENV"
            echo "DW_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Permanent release signing secrets not set. Debug APK only; cannot guarantee in-place updates.'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: extracted_files
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dwarkesh-OS-V10-RELEASE-APK
          path: extracted_files/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
